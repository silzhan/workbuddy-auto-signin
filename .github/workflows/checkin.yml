name: Checkin

on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: '5 2 * * *'    # 每日 UTC 2:05（北京时间 10:05，Qoder 开窗后）
    - cron: '5 14 * * *'   # 每日 UTC 14:05（北京时间 22:05，重试）
    - cron: '0 0 1 * *'    # 每月 1 号保活空提交

jobs:
  checkin:
    name: 签到
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'schedule' || github.event.schedule != '0 0 1 * *'
    concurrency:
      group: checkin
      cancel-in-progress: false

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "requests==2.32.3" "pycryptodome==3.21.0" --no-cache-dir

      - name: Run checkin
        run: python checkin_ci.py
        env:
          QODER_PAT: ${{ secrets.QODER_PAT }}
          QODERCN_PAT: ${{ secrets.QODERCN_PAT }}
          QODER_MACHINE_JSON: ${{ secrets.QODER_MACHINE_JSON }}
          TRAE_STORAGE_B64: ${{ secrets.TRAE_STORAGE_B64 }}
          WORKBUDDY_AUTH_B64: ${{ secrets.WORKBUDDY_AUTH_B64 }}

  keepalive:
    name: 每月空提交保活
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: keepalive
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 创建空提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive to prevent workflow suspension"
          git push
